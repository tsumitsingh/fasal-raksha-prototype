[project]
name = "fasalraksha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sumit Singh", email = "288617426+tsumitsingh@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.24.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
fasalraksha = "fasalraksha:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
